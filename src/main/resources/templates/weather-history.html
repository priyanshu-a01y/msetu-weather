<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Past MSetu weather observations recorded by this installation."><title>Weather history — MSetu</title><link rel="icon" href="/favicon.svg?v=ms-monogram-20261024" type="image/svg+xml"><link rel="stylesheet" href="/css/msetu.css"><link rel="stylesheet" href="/css/msetu-refinement.css?v=weather-icons-20261024"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="page"><div class="eyebrow">YOUR RECORDED LOOKUPS</div><h1>Weather history</h1><p class="page-intro">Past observations retrieved from the provider. These are not forecasts.</p><form class="search compact" action="/history" method="get"><label for="history-city">Filter by location</label><div class="search-control"><input id="history-city" name="city" maxlength="80" placeholder="e.g. Manali" th:value="${city}"><button class="button" type="submit">Filter</button></div></form><div class="table-wrap" th:if="${!records.isEmpty()}"><table><thead><tr><th>Location</th><th>Condition</th><th>Temperature</th><th>Humidity</th><th>Observed at (UTC)</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${r.location}+', '+${r.country}"></td><td th:text="${r.description}"></td><td th:text="${r.temperatureC}+'°C'"></td><td th:text="${r.humidity}+'%'"></td><td th:text="${#temporals.format(r.observedAt,'dd MMM yyyy HH:mm')}"></td></tr></tbody></table></div><div class="empty" th:if="${records.isEmpty()}"><h2>No recorded observations yet.</h2><p>Weather history appears after a successful current-weather lookup.</p><a class="button" href="/#search">Check the weather</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

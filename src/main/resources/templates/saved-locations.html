<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Your saved MSetu weather locations."><title>Saved places — MSetu</title><link rel="icon" href="/favicon.svg?v=ms-monogram-20261024" type="image/svg+xml"><link rel="stylesheet" href="/css/msetu.css"><link rel="stylesheet" href="/css/msetu-refinement.css?v=weather-icons-20261024"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="page"><div class="eyebrow">YOUR PLACES</div><h1>Saved locations</h1><p class="page-intro">A considered shortlist for your next check-in.</p><div class="list-card" th:each="l : ${locations}"><div class="saved-pin">⌖</div><div class="saved-info"><h2 th:text="${l.name}"></h2><p th:text="${l.country}"></p></div><a class="button secondary" th:href="@{/weather(city=${l.name})}">Current weather <span aria-hidden="true">↗</span></a><form th:action="@{/locations/{id}/delete(id=${l.id})}" method="post"><button class="button quiet" type="submit">Remove</button></form></div><div class="empty" th:if="${locations.isEmpty()}"><span class="empty-mark">⌖</span><h2>Your places will appear here.</h2><p>Search for a location and save it from its current weather page.</p><a class="button" href="/#search">Find a place</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

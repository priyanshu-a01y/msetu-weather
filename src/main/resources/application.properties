spring.application.name=MSetu
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/summitsky_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:require}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never

weather.api.key=${OPENWEATHER_API_KEY:}
weather.api.base-url=https://api.openweathermap.org
weather.api.geocoding-url=${OPENWEATHER_GEOCODING_URL:https://api.openweathermap.org/geo/1.0}
